name: Verify

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp clean verify
      - name: Verify on Linux
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp clean verify
      - name: Inspect packaged artifact
        shell: python
        run: |
          import runpy
          from pathlib import Path
          runpy.run_path(str(Path(".github") / "scripts" / "verify_artifact.py"), run_name="__main__")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: damageindicator-${{ matrix.os }}
          path: target/damageindicator-*.jar
          if-no-files-found: error
          retention-days: 7
